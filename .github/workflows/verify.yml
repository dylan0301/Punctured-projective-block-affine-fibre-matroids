name: Verify generalized family and submission data

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development checks
        run: python3 -m pip install -r requirements-dev.txt
      - name: Run exact verifier
        run: python3 scripts/verify.py
      - name: Run exact verifier with optimized Python
        run: python3 -O scripts/verify.py
      - name: Compile Python sources
        run: python3 -m compileall -q scripts
      - name: Type-check Python sources
        run: mypy scripts
      - name: Validate CITATION.cff
        uses: citation-file-format/cffconvert-github-action@4cf11baa70a673bfdf9dad0acc7ee33b3f4b6084
        with:
          args: --validate
