name: Verify generalized family and submission data

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development checks
        run: python3 -m pip install -r requirements-dev.txt
      - name: Run exact verifier
        run: python3 scripts/verify.py
      - name: Run exact verifier with optimized Python
        run: python3 -O scripts/verify.py
      - name: Compile Python sources
        run: python3 -m compileall -q scripts
      - name: Type-check Python sources
        run: mypy scripts
      - name: Validate CITATION.cff
        uses: citation-file-format/cffconvert-github-action@4cf11baa70a673bfdf9dad0acc7ee33b3f4b6084
        with:
          args: --validate
